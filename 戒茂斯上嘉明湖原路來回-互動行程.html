<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>戒茂斯上嘉明湖原路來回－互動行程</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.45}header{position:sticky;top:0;z-index:3;background:#123b5d;color:#fff;padding:14px 16px;box-shadow:0 2px 8px #0003}h1{margin:0;font-size:1.15rem}header small{color:#d6e5f0}main{max-width:900px;margin:auto;padding:12px}.controls,.day{background:#fff;border-radius:12px;padding:12px;margin-bottom:14px;box-shadow:0 1px 5px #0002}.controls-title{font-weight:700;color:#123b5d;margin-bottom:8px}.start-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.start-grid label{font-size:.85rem;color:#667785}input[type=time]{display:block;width:100%;margin-top:3px;padding:8px;border:1px solid #9db2c0;border-radius:7px;font-size:1rem;background:#fff;color:#17202a}.toggle{display:flex;gap:7px;align-items:center;margin-top:10px;font-size:.9rem}.legend{display:flex;gap:14px;margin-top:9px;font-size:.8rem;color:#667785}.legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px}.up{color:#d45532}.down{color:#2468a8}.upbg{border-left-color:#d45532!important;background:#fff1eb}.downbg{border-left-color:#2468a8!important;background:#edf6ff}.day-head{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid #123b5d;padding-bottom:8px;margin-bottom:3px}.day h2{margin:0;color:#123b5d;font-size:1.05rem}.summary{text-align:right;white-space:nowrap;font-size:.84rem}.route{position:relative}.route:before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:3px;background:#c8d5de}.point{position:relative;display:grid;grid-template-columns:30px 1fr 105px;gap:8px;padding:10px 0}.dot{width:29px;height:29px;border-radius:50%;background:#123b5d;border:4px solid #dcebf4;z-index:1}.point:first-child .dot{background:#25855e}.point:last-child .dot{background:#6e4d97}.point-name{font-weight:700}.point-meta{font-size:.82rem;color:#667785}.time-box{font-size:.72rem;color:#667785}.time-box input{font-size:.92rem;font-weight:800;color:#123b5d;margin-top:2px;padding:5px}.stop-controls{margin:0 0 5px 37px;padding:6px 8px;border-left:4px solid #aab9c4;background:#f7fafc;font-size:.82rem;color:#667785}.stop-controls label{display:inline-flex;align-items:center;gap:5px;margin-right:10px}.stop-controls input{width:66px;padding:4px;border:1px solid #9db2c0;border-radius:5px;font-size:.9rem;color:#123b5d}.segment{margin-left:37px;border-left:4px solid #d9e2e8;padding:6px 8px 8px 10px;font-size:.84rem;color:#667785}.move{font-weight:800}.seg-title{font-weight:700;color:#123b5d}.note{font-size:.8rem;color:#667785}@media(max-width:600px){main{padding:8px}.start-grid{gap:5px}.day{padding:10px 9px}.point{grid-template-columns:30px 1fr 92px;gap:6px;padding:8px 0}.point-name{font-size:.92rem}.point-meta{font-size:.78rem}.time-box input{font-size:.86rem}.segment{margin-left:36px;font-size:.78rem;padding-left:7px}.segment span:last-child{display:block}.stop-controls{margin-left:36px}.route:before{left:13px}}@media print{header{position:static}.controls{display:none}body{background:#fff}.day{box-shadow:none;break-inside:avoid}}</style></head><body><header><h1>戒茂斯上嘉明湖原路來回－互動行程</h1><small>2026/9/25–27｜每個點都可修改出發時間與休息時間</small></header><main><section class="controls"><div class="controls-title">每日第一個點的預設出發時間</div><div class="start-grid"><label>9/25<input id="start-0925" type="time" value="07:00"></label><label>9/26<input id="start-0926" type="time" value="07:00"></label><label>9/27<input id="start-0927" type="time" value="07:00"></label></div><label class="toggle"><input id="lake-option" type="checkbox" checked> D2 納入「獵寮營地／嘉明湖」往返</label><div class="legend"><span><b style="background:#d45532"></b>上升</span><span><b style="background:#2468a8"></b>下降</span><span>可直接修改每個點的出發時間</span></div></section><section class="day" data-day="0925"><div class="day-head"><h2>9/25｜登山口 → 新武呂溪營地</h2><div class="summary"><span class="up" data-up>上升 0m</span><br><span class="down" data-down>下降 0m</span></div></div><div class="route" data-route></div></section><section class="day" data-day="0926"><div class="day-head"><h2>9/26｜新武呂溪營地 → 獵寮營地</h2><div class="summary"><span class="up" data-up>上升 0m</span><br><span class="down" data-down>下降 0m</span></div></div><div class="route" data-route></div></section><section class="day" data-day="0927"><div class="day-head"><h2>9/27｜獵寮營地 → 登山口</h2><div class="summary"><span class="up" data-up>上升 0m</span><br><span class="down" data-down>下降 0m</span></div></div><div class="route" data-route></div></section><p class="note">註：每個點的出發時間與休息時間可獨立修改；修改後，後續各點的預估到達時間會自動更新。上升／下降依各點海拔計算，實際時間仍會受休息、天候與路況影響。</p></main><script>var routes={"0925":[["戒茂斯登山口 156.5K處","1883m",40,182,"0.4k"],["戒茂斯前鋒","2065m",130,425,"1.6k"],["戒茂斯岔路","2490m",70,12,"0.2k"],["戒茂斯岔路","2502m",70,-294,"1.6k"],["新武呂溪營地","2208m",0,0,""]],"0926":[["新武呂溪營地","2208m",140,561,"2.1k"],["排球場營地","2769m",30,11,"0.5k"],["足球場營地","2780m",190,350,"3.3k"],["妹池","3130m",30,-35,"0.5k"],["獵寮營地","3095m",70,215,"1.4k"],["嘉明湖","3310m",60,-215,"1.4k"],["獵寮營地","3095m",0,0,""]],"0927":[["獵寮營地","3095m",70,215,"1.4k"],["嘉明湖","3310m",50,-215,"1.4k"],["獵寮營地","3095m",50,35,"0.5k"],["妹池","3130m",120,-350,"3.3k"],["足球場營地","2780m",120,-572,"2.6k"],["新武呂溪營地","2208m",60,282,"1.6k"],["戒茂斯岔路","2490m",80,-425,"1.6k"],["戒茂斯前鋒","2065m",25,-182,"0.4k"],["戒茂斯登山口 156.5K處","1883m",0,0,""]]};
var manual={};
var rests={};
function parseTime(value){
  var a=String(value||'07:00').split(':');
  var h=parseInt(a[0],10); var m=parseInt(a[1],10);
  if(isNaN(h)) h=7; if(isNaN(m)) m=0;
  return h*60+m;
}
function formatTime(total){
  total=((total%1440)+1440)%1440;
  var h=Math.floor(total/60); var m=total%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function durationText(n){
  n=parseInt(n,10)||0;
  if(n>=60) return Math.floor(n/60)+'h '+(n%60?n%60+'m':'');
  return n+'m';
}
function findDay(day){
  var all=document.getElementsByTagName('section'),i;
  for(i=0;i<all.length;i++) if(all[i].getAttribute('data-day')===day) return all[i];
  return null;
}
function renderDay(day){
  var sec=findDay(day), r, lake, start, t, up=0, down=0, out='', i, p, name, elev, dur, delta, dist, d, cls, arrow, rest, dep;
  if(!sec) return;
  r=JSON.parse(JSON.stringify(routes[day]));
  lake=document.getElementById('lake-option');
  if(day==='0926' && lake && !lake.checked) r.splice(4,3);
  start=document.getElementById('start-'+day);
  t=parseTime(start ? start.value : '07:00');
  if(!manual[day]) manual[day]={};
  if(!rests[day]) rests[day]={};
  for(i=0;i<r.length;i++){
    p=r[i]; name=p[0]; elev=p[1]; dur=p[2]; delta=p[3]; dist=p[4];
    if(i>0){
      d=r[i-1][3];
      if(d>0) up+=d; else down+=Math.abs(d);
      cls=d>0?'upbg':(d<0?'downbg':'');
      arrow=d>0?'上升':(d<0?'下降':'平路');
      out+='<div class="segment '+cls+'"><span class="move '+(d>0?'up':(d<0?'down':''))+'">'+arrow+' '+(d?Math.abs(d)+'m':'')+'</span><span class="seg-title">　到下一點：'+name+'</span><span>｜行走 '+durationText(r[i-1][2])+'｜距離 '+(r[i-1][4]||'—')+'｜預估到達 '+formatTime(t)+'</span></div>';
    }
    rest=rests[day][i]===undefined?0:rests[day][i];
    dep=manual[day][i]===undefined?formatTime(t+Number(rest)):manual[day][i];
    out+='<div class="point"><div class="dot"></div><div><div class="point-name">'+name+'</div><div class="point-meta">海拔 '+elev+'｜'+(i?'預估到達':'當日起點')+'</div></div><label class="time-box">出發時間<input type="time" data-depart="'+i+'" value="'+dep+'"></label></div>';
    out+='<div class="stop-controls"><label>休息<input type="number" min="0" step="5" data-rest="'+i+'" value="'+rest+'"> 分鐘</label><span>休息後出發：'+dep+'</span></div>';
    t=parseTime(dep)+dur;
  }
  sec.querySelector('[data-route]').innerHTML=out;
  sec.querySelector('[data-up]').innerHTML='上升 '+up+'m';
  sec.querySelector('[data-down]').innerHTML='下降 '+down+'m';
  var depInputs=sec.querySelectorAll('[data-depart]'), restInputs=sec.querySelectorAll('[data-rest]'), j;
  for(j=0;j<depInputs.length;j++) (function(input){
    input.onchange=function(){ manual[day][input.getAttribute('data-depart')]=input.value; renderDay(day); };
  })(depInputs[j]);
  for(j=0;j<restInputs.length;j++) (function(input){
    input.onchange=function(){ var k=input.getAttribute('data-rest'); rests[day][k]=Number(input.value)||0; delete manual[day][k]; renderDay(day); };
  })(restInputs[j]);
}
function renderAll(){ renderDay('0925'); renderDay('0926'); renderDay('0927'); }
function bindGlobal(){
  var ids=['start-0925','start-0926','start-0927','lake-option'],i,e;
  for(i=0;i<ids.length;i++){ e=document.getElementById(ids[i]); if(e) e.onchange=renderAll; }
}
bindGlobal();
renderAll();</script></body></html>
