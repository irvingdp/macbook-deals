<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>嘉明湖費用估算</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { color: #285943; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: .6rem; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { background: #eef6f0; }
    .total { font-size: 1.2rem; font-weight: 700; color: #b23b27; }
  </style>
</head>
<body>
  <h1>嘉明湖費用估算</h1>
  <p>以 6 人分攤計算：</p>
  <table>
    <thead>
      <tr><th>項目</th><th>總額</th><th>每人</th></tr>
    </thead>
    <tbody>
      <tr><td>包車</td><td>19,500 元</td><td>3,250 元</td></tr>
      <tr><td>搭伙</td><td>18,000 元</td><td>3,000 元</td></tr>
      <tr class="total"><td>合計</td><td>37,500 元</td><td>6,250 元</td></tr>
    </tbody>
  </table>
</body>
</html>
